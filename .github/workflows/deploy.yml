name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pas de `enablement: true` : le GITHUB_TOKEN n'a pas le droit de creer
      # le site Pages (Create Pages site -> "Resource not accessible by
      # integration"). Pages doit etre active une fois a la main, dans
      # Settings > Pages, avec Source = GitHub Actions. Cette action se
      # contente alors de lire la configuration existante.
      - uses: actions/configure-pages@v5
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
